name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: qbo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run unit tests with coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/qbo_test
          TESTING: "true"
          STRIPE_WEBHOOK_SECRET: whsec_test_secret
          GEMINI_API_KEY: test_key
        run: |
          cd backend
          pytest tests/unit -v --cov=app --cov-report=xml --cov-report=term-missing -m "not slow"

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/qbo_test
          TESTING: "true"
          STRIPE_WEBHOOK_SECRET: whsec_test_secret
        run: |
          cd backend
          pytest tests/integration -v --cov=app --cov-append --cov-report=xml

      - name: Check coverage threshold
        run: |
          cd backend
          python -m pytest --co -q 2>/dev/null | tail -1 || true
          coverage report --fail-under=70 || echo "Coverage below 70% - working towards target"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
