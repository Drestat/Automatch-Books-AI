[pytest]
# Test discovery paths
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async test support
asyncio_mode = auto

# Test markers for categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests requiring database
    e2e: marks tests as end-to-end tests
    critical: marks tests for critical bugs (BUG-001 through BUG-005)
    security: marks tests for security vulnerabilities
    unit: marks tests as fast unit tests

# Output and reporting options
addopts =
    --strict-markers
    --tb=short
    --verbose
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=70
    -ra

# Coverage paths
# Note: Coverage is configured in .coveragerc

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (prevent hanging)
timeout = 300

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::FutureWarning
